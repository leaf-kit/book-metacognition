<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메타인지를 가지고 살아가기</title>
<meta name="author" content="리프 메타 (leaf meta)">
<meta name="description" content="엔지니어로, 학생으로, 직업인으로, 사회인으로. 자기 판단이 어느 자리에서 어긋나는지를 네 역할에서 따라간 기록. 본문 286쪽, 72개 절. 무료로 읽고 배포할 수 있다.">
<meta property="og:type" content="book">
<meta property="og:title" content="메타인지를 가지고 살아가기">
<meta property="og:description" content="엔지니어로, 학생으로, 직업인으로, 사회인으로. 본문 286쪽, 72개 절.">
<meta property="og:image" content="cover.png">
<link rel="icon" href="cover.png">
<style>
  :root {
    --paper: #f4f5f7;
    --dark: #1b1e23;
    --dark2: #24272e;
    --line: #363a44;
    --accent: #7fb2d4;
    --mute: #99a0ab;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--dark);
    color: var(--paper);
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: var(--dark2);
    border-bottom: 1px solid var(--line);
  }
  header img {
    width: 42px;
    height: auto;
    border-radius: 3px;
    flex: 0 0 auto;
  }
  .titles { min-width: 0; flex: 1 1 auto; }
  .titles h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .titles p {
    margin: 3px 0 0;
    font-size: 12px;
    color: var(--mute);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  nav { display: flex; gap: 8px; flex: 0 0 auto; }
  nav a {
    display: inline-block;
    padding: 7px 13px;
    border: 1px solid var(--line);
    border-radius: 5px;
    color: var(--paper);
    font-size: 13px;
    text-decoration: none;
    white-space: nowrap;
  }
  nav a:hover { border-color: var(--accent); color: var(--accent); }
  nav a.primary { background: var(--accent); border-color: var(--accent); color: #11222c; font-weight: 700; }
  nav a.primary:hover { background: #9dc7e2; color: #11222c; }
  main { flex: 1 1 auto; min-height: 0; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--paper); }
  footer {
    flex: 0 0 auto;
    padding: 9px 20px;
    background: var(--dark2);
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--mute);
  }
  footer a { color: var(--mute); }
  @media (max-width: 720px) {
    header { gap: 10px; padding: 8px 11px; }
    header img { display: none; }
    .titles h1 { font-size: 15px; }
    .titles p { display: none; }
    nav a { padding: 6px 9px; font-size: 12px; }
    footer { display: none; }
  }
</style>
</head>
<body>

<header>
  <img src="cover.png" alt="책 표지">
  <div class="titles">
    <h1>메타인지를 가지고 살아가기</h1>
    <p>엔지니어로, 학생으로, 직업인으로, 사회인으로 &nbsp;·&nbsp; 리프 메타 (leaf meta) &nbsp;·&nbsp; 286쪽</p>
  </div>
  <nav>
    <a class="primary" href="book.pdf" download="metacognition-ko.pdf">PDF 내려받기</a>
    <a href="https://github.com/leaf-kit/book-metacognition">저장소</a>
  </nav>
</header>

<main>
  <iframe id="viewer" title="메타인지를 가지고 살아가기 본문" allow="fullscreen"></iframe>
</main>

<script>
  // 좁은 화면에서는 목차를 접고 연다. 넓은 화면에서는 목차가 보이는 편이 찾기 좋다.
  var src = "pdfjs/web/viewer.html?file=..%2F..%2Fbook.pdf";
  if (window.matchMedia("(max-width: 900px)").matches) {
    src += "#pagemode=none";
  }
  document.getElementById("viewer").src = src;
</script>

<footer>
  본문 286쪽, 72개 절, 각주 항목 75개.
  각주가 붙은 문장은 실험실이 확인해 준 것이고, 없는 문장은 지은이가 겪었거나 지어낸 것이다.
  출처를 밝히면 복사, 재배포, 인쇄, 스터디 자료로 쓸 수 있다.
  절별로 읽으려면 <a href="https://github.com/leaf-kit/book-metacognition">저장소</a>의 차례를 연다.
  판은 <a href="https://github.com/leaf-kit/book-metacognition/releases/latest">{{TAG}}</a> 이다.
</footer>

</body>
</html>
